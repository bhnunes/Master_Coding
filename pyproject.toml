[project]
name = "master-project"
version = "0.1.0"
description = "High-performance medical imaging experiments"
requires-python = ">=3.10,<3.13" # Expanded to allow 3.10
# Only keep packages that DON'T conflict or use flexible versioning here
dependencies = [
    "numpy",
    "pandas",
    "openslide-python",
    "tiatoolbox",
    "h5py",
    "tqdm",
]

[dependency-groups]
# Master Project Research Group (Python 3.12)
research = [
    "torch",
    "torchvision",
    "torchaudio",
    "scikit-learn==1.4.2",
    "scikit-image==0.23.2",
    "scikit-optimize==0.10.2",
    "opencv-contrib-python==4.9.0.80",
    "torch-lr-finder==0.2.2",
    "seaborn==0.13.2",
    "torchmetrics==1.9.0",
    "optuna==4.8.0",
    "schedulefree==1.4.1",
    "aim",
    "numba>=0.60.0",
    "joblib>=1.4.0",
    "matplotlib",
    "shapely>=2.0.0",
    "albumentations",
    "segmentation-models-pytorch",
    "PyYAML",
    "psutil",
    "pyarrow",
    "orjson",
    "python-dotenv==1.2.2"
]

dev = [
    "pytest>=8.0.0",
    "ruff==0.15.5",
    "mypy>=1.13.0",
    "torchinfo",
    "line-profiler>=4.1.0",
    "scalene>=1.5.0",
    "py-spy>=0.3.14",
    "snakeviz>=2.2.0",
    "pytest-cov==7.0.0"
]

# GrandQC Group (Python 3.10)
grandqc = [
    "numpy==1.26.4",
    "torch==2.0.1", # Strict legacy version
    "opencv-python-headless==4.7.0.72",
    "Pillow==10.4.0",
    "scipy==1.14.1",
    "segmentation-models-pytorch==0.3.1",
    "scikit-image==0.21.0",
    "six==1.16.0",
    "tifffile==2023.4.12",
    "torch==2.0.1",
    "tqdm==4.65.0",
    "zarr==2.16.1",
    "rasterio==1.4.3",
    "imagecodecs==2024.12.30",
    "python-dotenv==1.2.2"
]

# --- UV Magic: Fetching CUDA 12.6 specifically ---
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
segmentation-models-pytorch = { git = "https://github.com/qubvel/segmentation_models.pytorch" }

# --- Tool Configuration ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
